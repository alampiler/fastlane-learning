name: Android Release Build   # назва workflow, видно у вкладці Actions

on:                            # тригер — коли запускати весь workflow
   push:                        # реагувати на push комітів
      branches:
        - main            
        - dev       

jobs:                          # список jobs у цьому workflow
    build-android:               # довільна назва job, видно в UI Actions
      runs-on: ubuntu-latest     # на якій віртуалці виконувати job

      env:                       # environment variables, доступні всім steps нижче
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}  # пароль keystore з GitHub Secrets
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}                  # alias ключа з GitHub Secrets
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}            # пароль ключа з GitHub Secrets
        ANDROID_VERSION_CODE: ${{ github.run_number }}                       # версія збірки, автоматично інкрементується GitHub Actions при кожному запуску workflow
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}                      # Firebase App ID з GitHub Secrets, потрібен для fastlane deploy
        FIREBASE_APP_ID_DEV: ${{ secrets.FIREBASE_APP_ID_DEV }}              # Firebase App ID для dev-збірки з GitHub Secrets, потрібен для fastlane deploy
        GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json        # шлях до JSON-файлу Firebase service account, який ми створимо у одному зі steps нижче

      steps:                     # послідовний список кроків job
        - name: Checkout
          uses: actions/checkout@v4   # клонує репозиторій у файлову систему віртуалки

        - name: Setup Node
          uses: actions/setup-node@v4  # ставить Node.js на віртуалку
          with:
            node-version: '22'         # версія Node (звірена з engines.node у package.json)
            cache: 'yarn'               # кешує yarn-залежності за хешем yarn.lock

        - name: Install dependencies
          run: yarn install --immutable   # ставить node_modules; падає, якщо yarn.lock розсинхронізований

        - name: Decode keystore
          # base64 -> назад у бінарний файл, саме туди, де його очікує build.gradle
          run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

        - name: Write Firebase service account
          # Firebase service account JSON, який потрібен для fastlane deploy, зберігається у GitHub Secrets (без base64 — це вже текст).
          # Передаємо через env, а не текстову підстановку в run — інакше лапки JSON ламають bash-парсинг команди.
          env:
            FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-service-account.json

        - name: Write .env files
          env:
            ANDROID_ENV_DEV: ${{ secrets.ANDROID_ENV_DEV }}
            ANDROID_ENV_PROD: ${{ secrets.ANDROID_ENV_PROD }}
          run: |
            printf '%s' "$ANDROID_ENV_DEV" > .env.dev
            printf '%s' "$ANDROID_ENV_PROD" > .env.prod

        - name: Setup Ruby
          uses: ruby/setup-ruby@v1
          with:
            ruby-version: '3.3'    # версія Ruby для CI (setup-ruby не читає нижню межу з Gemfile)
            bundler-cache: true    # кешує gems між запусками

        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v4   # кешує Gradle wrapper і build cache між запусками

        - name: Fastlane beta dev # запускає fastlane lane beta, яка збирає Android APK і завантажує його у Firebase App Distribution 
          if: github.ref_name == 'dev'
          run: bundle exec fastlane android beta_dev

        - name: Fastlane beta prod
          if: github.ref_name == 'main'
          run: bundle exec fastlane android beta_prod